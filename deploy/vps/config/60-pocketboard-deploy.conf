# Install as /etc/ssh/sshd_config.d/60-pocketboard-deploy.conf (root:root 0644),
# then `sshd -t` before reloading. The account can run the gate and nothing
# else: no shell, TTY, forwarding, tunnels, or user rc files, and its key file
# is root-owned so the account cannot change its own keys.
Match User pocketboard-deploy
    AuthorizedKeysFile /etc/ssh/authorized_keys/%u
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    ForceCommand /usr/local/lib/pocketboard/ssh-gate
    PermitTTY no
    PermitUserRC no
    PermitTunnel no
    AllowTcpForwarding no
    AllowStreamLocalForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    GatewayPorts no
    PermitListen none
    PermitOpen none
