# Serves the built SPA and forwards /api/ to the API container, mirroring the
# Vite dev proxy so the browser sees one origin in both environments.
server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;

    # Docker's embedded DNS. Resolving per request (via the variable below)
    # keeps nginx working when the API container is replaced during a rollback.
    resolver 127.0.0.11 valid=10s ipv6=off;

    include /etc/nginx/snippets/security-headers.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        set $api_upstream http://api:3000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # TLS terminates at the host reverse proxy in front of this container,
        # which must set this header; the published port is loopback-only.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /assets/ {
        # Vite content-hashes these file names, so they never change in place.
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
